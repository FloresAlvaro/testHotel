name: testhotel-tests

services:
  db:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: hotel_test
      POSTGRES_USER: hotel_test
      POSTGRES_PASSWORD: isolated-test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_test -d hotel_test"]
      interval: 2s
      timeout: 5s
      retries: 30
