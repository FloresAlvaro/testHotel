name: Verificaciones del hotel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend-H
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hotel_test:ci-test-only@127.0.0.1:5432/hotel_test
      TEST_DATABASE_URL: postgresql://hotel_test:ci-test-only@127.0.0.1:5432/hotel_test
      JWT_SECRET: isolated-ci-secret-at-least-32-characters-long
      ENABLE_HEALTH_CHECK: 'false'
    services:
      postgres:
        image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: hotel_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: hotel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hotel_test -d hotel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend-H/package-lock.json
      - run: npm ci
      - name: Exigir pruebas PostgreSQL
        run: node -e "if (!process.env.TEST_DATABASE_URL) throw new Error('TEST_DATABASE_URL es obligatoria en CI')"
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Verificar copia externa y restauración aislada
        run: python3 ../database/backup/test-backup.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend-H
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend-H/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hotel_test:ci-test-only@127.0.0.1:5432/hotel_e2e
      E2E_DATABASE_URL: postgresql://hotel_test:ci-test-only@127.0.0.1:5432/hotel_e2e
      JWT_SECRET: isolated-ci-secret-at-least-32-characters-long
      ENABLE_HEALTH_CHECK: 'false'
      PORT: '3300'
      APP_URL: http://127.0.0.1:3311
      CORS_ORIGIN: http://127.0.0.1:3311
      CORS_CREDENTIALS: 'true'
      PAYMENT_PROVIDER: demo
      ALLOW_DEMO_PAYMENTS: 'true'
      E2E_ALLOW_WRITES: '1'
      MFA_ENABLED: 'true'
      # Isolated CI encryption fixture, never an operational key.
      MFA_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      E2E_BASE_URL: http://127.0.0.1:3311
      E2E_API_URL: http://127.0.0.1:3300/api
      NUXT_PUBLIC_API_BASE: http://127.0.0.1:3300/api
      NUXT_API_INTERNAL_BASE: http://127.0.0.1:3300/api
      E2E_BROWSER: chromium
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      MAIL_FROM: demo@hotel.test
      MAIL_DEMO: 'true'
      E2E_MAIL_URL: http://127.0.0.1:8025
    services:
      mailpit:
        image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
        ports: ['1025:1025', '8025:8025']
      postgres:
        image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: hotel_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: hotel_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hotel_test -d hotel_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            Backend-H/package-lock.json
            Frontend-H/package-lock.json
      - run: npm ci --prefix Backend-H
      - run: npm ci --prefix Frontend-H
      - run: npx playwright install --with-deps chromium
        working-directory: Frontend-H
      - run: npm run e2e:prepare --prefix Backend-H
      - run: npm run build --prefix Frontend-H
      - name: Iniciar API y frontend aislados
        run: |
          node Backend-H/server.js > /tmp/hotel-api.log 2>&1 &
          NITRO_HOST=127.0.0.1 NITRO_PORT=3311 node Frontend-H/.output/server/index.mjs > /tmp/hotel-frontend.log 2>&1 &
          node Backend-H/scripts/wait-e2e.js
      - run: npm run test:e2e --prefix Frontend-H
      - name: Adjuntar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hotel-e2e-diagnostics
          path: |
            Frontend-H/test-results/
            /tmp/hotel-api.log
            /tmp/hotel-frontend.log
          retention-days: 7
  security-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Construir imágenes para probar permisos efectivos
        run: |
          docker build --pull -t hotel-security-api Backend-H
          docker build --pull -t hotel-security-ui Frontend-H
      - name: Probar roles, contenedores, MFA y restauración aislados
        env:
          SECURITY_BACKEND_IMAGE: hotel-security-api
          SECURITY_FRONTEND_IMAGE: hotel-security-ui
        run: python3 database/security/test-roles.py --images
