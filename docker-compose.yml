services:
  db:
    image: postgres:16-alpine
    container_name: hotel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_db}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/001-operations.sql:/docker-entrypoint-initdb.d/02-operations.sql:ro
      - ./database/migrations/002-customer-role.sql:/docker-entrypoint-initdb.d/03-customer-role.sql:ro
      - ./database/migrations/003-customer-portal.sql:/docker-entrypoint-initdb.d/04-customer-portal.sql:ro
      - ./database/migrations/004-guest-services.sql:/docker-entrypoint-initdb.d/04b-guest-services.sql:ro
      - ./database/migrations/005-reservation-guests.sql:/docker-entrypoint-initdb.d/04c-reservation-guests.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend-H
    container_name: hotel-backend
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCIES: ${STRIPE_CURRENCIES:-USD,EUR}
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel_user}:${POSTGRES_PASSWORD:-hotel_password}@db:5432/${POSTGRES_DB:-hotel_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe estar definido en el .env}
      JWT_EXPIRE: ${JWT_EXPIRE:-24h}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-3001}}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
    volumes:
      - ./database/migrations:/app/migrations:ro
      - postgres_backups:/backups:ro
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend-H
    container_name: hotel-frontend
    restart: unless-stopped
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_API_INTERNAL_BASE: http://backend:3000/api
      NUXT_PUBLIC_API_BASE: http://localhost:${BACKEND_PORT:-3000}/api
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend

  backups:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/loop.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_db}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_password}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./database/backup:/scripts:ro
      - postgres_backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_backups:
  postgres_data:
